[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-lab"
version = "0.1.0"
description = "Un laboratorio de agentes locales con Ollama, construido desde cero."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
ai-agent-lab = "ai_agent_lab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ollama: prueba real y opcional contra Ollama (AI_AGENT_LAB_TEST_OLLAMA=1)",
    "docker: prueba real y opcional contra Docker (AI_AGENT_LAB_TEST_DOCKER=1)",
    "acceptance: prueba de aceptación integrada y opcional con Ollama y Docker",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
